{% extends "base.html" %}
{% block title %}{{ code }} {{ title }}{% endblock %}
{% block content %}
<div class="err-box">

  <h1 class="err-title">{{ title }}</h1>
  <p class="err-detail">{{ detail }}</p>
  <div class="form-actions form-actions-center">
    <a class="btn btn-primary" href="{{ url_for('dashboard.dashboard') }}">返回工作台</a>
  </div>
</div>
{% endblock %}
